<!-- @dsCard group="Admin dashboard" viewport="1280x820" name="Admin console" subtitle="KPIs + monthly chart + job approval queue with bulk actions" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krama — Admin console</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="stylesheet" href="mobile.css?v=6">
<!-- babel.min.js removed: app.jsx is precompiled to compiled/app.js at build time
     (node krama/build-jsx.js ui_kits/admin-dashboard app.jsx). It was 3MB of parser shipped
     to every admin, which then compiled a 612KB app.jsx in the browser on every single page
     load before anything could render.

     All `defer` so none of them block the first paint. Deferred scripts still execute in
     document order and are guaranteed to finish before DOMContentLoaded, which is what the
     boot code at the end of body waits for. compiled/app.js MUST stay last. -->
<script defer src="../../vendor/react.production.min.js?v=1"></script>
<script defer src="../../vendor/react-dom.production.min.js?v=1"></script>
<script defer src="../../_ds_bundle.js?v=4"></script>
<script defer src="../../brand.js?v=4"></script>
<script>window.KramaAdminApp = null; window.KRAMA_ADMIN_API = null;</script>
<script defer src="../../vendor/lucide.min.js?v=1"></script>
<script defer src="api.js?v=42"></script>
<script defer src="compiled/app.js?v=231"></script>
<style>html,body{margin:0;background:var(--surface-page)}</style>
</head>
<body>
<div id="root"></div>
<script>
// Runs a callback once the deferred scripts have executed. Deferred scripts are guaranteed
// to run before DOMContentLoaded, so React/ReactDOM/the DS bundle/the app are all defined
// by the time this fires.
window.__kramaReady = function (fn) {
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fn); }
  else { fn(); }
};
function showLoadError(msg) {
  var el = document.getElementById('root');
  el.innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2 style="color:#c00">Failed to load</h2><pre style="font-size:13px;color:#555;white-space:pre-wrap">' + msg + '</pre></div>';
}
</script>
<script>
// Wrapped in __kramaReady because `class ErrBoundary extends React.Component` is evaluated
// as soon as this script runs — with the vendor scripts now deferred, React isn't defined
// during parsing, so this must wait until they've executed.
window.__kramaReady(function(){
class ErrBoundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error("Admin app error:", err && err.stack || err); }
  render(){
    if(this.state.err){
      return React.createElement("div",{style:{padding:"40px",fontFamily:"var(--font-sans)",color:"var(--danger)"}},
        React.createElement("h2",{style:{color:"var(--text-strong)"}},"Something went wrong"),
        React.createElement("pre",{style:{whiteSpace:"pre-wrap",fontSize:"12px",color:"var(--text-muted)"}}, String(this.state.err && (this.state.err.stack||this.state.err.message) || this.state.err)));
    }
    return this.props.children;
  }
}
// Both bundles are deferred so they have already executed by the time this runs; the retry
// only covers edge cases. Bounded, because with the old fetch-and-compile boot gone there is
// nothing else to report a failed load — otherwise a missing app.js would leave the admin
// staring at a blank page indefinitely.
var mountDeadline = Date.now() + 10000;
function mount(){
  if(!window.KramaAdminApp||!window.KramaDesignSystem_1a6f65||!window.KRAMA_ADMIN_API){
    if(Date.now() > mountDeadline){
      return showLoadError('The admin app did not load.\n\nMissing: '
        + (!window.KramaAdminApp ? 'compiled/app.js ' : '')
        + (!window.KramaDesignSystem_1a6f65 ? '_ds_bundle.js ' : '')
        + (!window.KRAMA_ADMIN_API ? 'api.js' : '')
        + '\n\nCheck the browser console and the network tab.');
    }
    return setTimeout(mount,40);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(ErrBoundary,null,React.createElement(window.KramaAdminApp))
  );
}
mount();
});
</script>
</body></html>
